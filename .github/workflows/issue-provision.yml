name: Provision Approved Issue Request

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

jobs:
  provision:
    name: Provision Approved Repository
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'approved') ||
      (github.event_name == 'issue_comment' && github.event.issue.state == 'open' && github.event.comment.body == '/approved')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App Installation Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Provision Repository
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ORG_NAME: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 scripts/issue_provision.py

      - name: Install openpyxl
        run: pip install --quiet openpyxl

      - name: Generate Excel report from CSV
        env:
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          python3 scripts/generate_xlsx.py

      - name: Upload Excel report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: projects-report-${{ github.run_id }}
          path: requests/projects.xlsx
          if-no-files-found: warn
