name: Project Repository Request
description: Request a new project repository for your module in SCSSA-UoK.
title: "[Project Request]: "
labels: ["project-request"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🎓 SCSSA-UoK Project Repository Request
        Fill out this form to request your team's project repository.
        An automated bot will validate your inputs immediately. Once approved by an organization administrator, your repository will be created with a group number assigned automatically.

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Select the module this project belongs to.
      options:
        - "COSC 32133 / BECS 32263 – Full-Stack Software Development (FSSD)"
    validations:
      required: true

  - type: dropdown
    id: batch
    attributes:
      label: Student Batch
      description: Select your student batch (intake year).
      options:
        - "22/23"
        - "23/24"
        - "24/25"
    validations:
      required: true

  - type: input
    id: short_title
    attributes:
      label: Project Short Title
      description: "A short 1–3 word title for your project (e.g. `Library System`, `Smart Bus`, `Ecommerce`). Letters, digits, spaces, and hyphens only. It will be automatically uppercased."
      placeholder: Library System
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Project Description
      description: One or two sentences describing what you are building.
      placeholder: A web-based library management system with real-time book tracking and a student portal.
    validations:
      required: true

  - type: input
    id: members
    attributes:
      label: Team Members (GitHub Usernames)
      description: Comma-separated GitHub usernames of your teammates. You (the issue creator) will automatically be assigned as Admin. Maximum 6 members.
      placeholder: teammate1, teammate2, teammate3
    validations:
      required: false
