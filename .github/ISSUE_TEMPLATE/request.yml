name: Project Repository Request
description: Request a new project repository for your module in SCSSA-UoK.
title: "[Project Request]: "
labels: ["project-request"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🎓 SCSSA-UoK Project Repository Request
        Fill out this form to request your team's project repository.
        An automated bot will validate your inputs immediately. Once approved by an organization administrator, your repository will be created with a group number assigned automatically.

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Select the module this project belongs to.
      options:
        - "COSC 32133 / BECS 32263 – Full-Stack Software Development (FSSD)"
    validations:
      required: true

  - type: dropdown
    id: batch
    attributes:
      label: Student Batch
      description: Select your student batch (intake year).
      options:
        - "22/23"
        - "23/24"
        - "24/25"
    validations:
      required: true

  - type: input
    id: short_title
    attributes:
      label: Project Short Title
      description: "A short 1–4 word title for your project (e.g. `Library System`, `Smart Bus`, `Ecommerce`). Use letters and digits separated by spaces or hyphens. It will be automatically converted to Title Case."
      placeholder: Library System
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Project Description
      description: One or two sentences describing what you are building.
      placeholder: A web-based library management system with real-time book tracking and a student portal.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 👥 Team Members
        Enter the details for each team member below. Groups can have **2–4 members**. Leave rows blank for unused slots.
        **Member 1** is the **Project Lead** and will be assigned as repository Admin.

  - type: input
    id: member1_student_no
    attributes:
      label: "Member 1 – Student No"
      description: "Registered university student number of the Project Lead (e.g. `E/22/001`)."
      placeholder: "EC/2022/001"
    validations:
      required: true

  - type: input
    id: member1_name
    attributes:
      label: "Member 1 – Full Name"
      description: "Full name of the Project Lead."
      placeholder: "Malan De Alwis"
    validations:
      required: true

  - type: input
    id: member1_github
    attributes:
      label: "Member 1 – GitHub Username"
      description: "GitHub username of the Project Lead. They will be assigned as repository Admin."
      placeholder: "malanalwis"
    validations:
      required: true

  - type: input
    id: member2_student_no
    attributes:
      label: "Member 2 – Student No"
      description: "Registered university student number (leave blank if not applicable)."
      placeholder: "EC/2022/026"
    validations:
      required: false

  - type: input
    id: member2_name
    attributes:
      label: "Member 2 – Full Name"
      description: "Full name of this team member (leave blank if not applicable)."
      placeholder: "Kavindu Sachinthe"
    validations:
      required: false

  - type: input
    id: member2_github
    attributes:
      label: "Member 2 – GitHub Username"
      description: "GitHub username of this team member (leave blank if not applicable)."
      placeholder: "kavindu-s"
    validations:
      required: false

  - type: input
    id: member3_student_no
    attributes:
      label: "Member 3 – Student No"
      description: "Registered university student number (leave blank if not applicable)."
      placeholder: "EC/2022/003"
    validations:
      required: false

  - type: input
    id: member3_name
    attributes:
      label: "Member 3 – Full Name"
      description: "Full name of this team member (leave blank if not applicable)."
      placeholder: "Dilshan Fernando"
    validations:
      required: false

  - type: input
    id: member3_github
    attributes:
      label: "Member 3 – GitHub Username"
      description: "GitHub username of this team member (leave blank if not applicable)."
      placeholder: "dilshan-f"
    validations:
      required: false

  - type: input
    id: member4_student_no
    attributes:
      label: "Member 4 – Student No"
      description: "Registered university student number (leave blank if not applicable)."
      placeholder: "EC/2022/019"
    validations:
      required: false

  - type: input
    id: member4_name
    attributes:
      label: "Member 4 – Full Name"
      description: "Full name of this team member (leave blank if not applicable)."
      placeholder: "Sachini Bandara"
    validations:
      required: false

  - type: input
    id: member4_github
    attributes:
      label: "Member 4 – GitHub Username"
      description: "GitHub username of this team member (leave blank if not applicable)."
      placeholder: "sachini-b"
    validations:
      required: false
